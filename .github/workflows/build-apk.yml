name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant to assemble'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Assemble Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Ensure Build Environment Secrets & Keystore
        run: |
          if [ ! -f .env ]; then
            touch .env
          fi
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Assemble Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: gradle :app:assembleDebug -Dorg.gradle.daemon=false -Dksp.daemon=false

      - name: Assemble Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: gradle :app:assembleRelease -Dorg.gradle.daemon=false -Dksp.daemon=false

      - name: Upload Debug APK Artifact
        if: ${{ github.event.inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: ProactiveMS-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ProactiveMS-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
